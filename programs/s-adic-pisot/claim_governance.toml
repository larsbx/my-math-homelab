# Claim-governance policy for larsbx/s-adic-pisot-conjecture-research.
#
# Read by the vendored `tools/claim_governance` package (larsbx/finite-math-kernels,
# pinned in vendored.toml). The status vocabulary is the PSC programme's
# (docs/METHODOLOGY.md rule R1); the ledger below must agree with CLAIMS.md,
# and a status change goes to both in the same commit. It states no mathematics.
#
# Run: PYTHONPATH=tools python -m claim_governance.cli --root .

[repository]
name = "larsbx/s-adic-pisot-conjecture-research"

[scan]
prose = ["README.md", "CLAIMS.md", "docs/**/*.md"]
source = ["kernel/sadic/**/*.mojo", "kernel/*.mojo", "kernel/tests/*.mojo", "reference/sadic_reference/*.py"]
exclude = []

[status]
classes = ["proved", "imported", "finite-domain", "conditional", "open", "bridge", "evidence", "retired"]

[status.synonyms]
"Repository-proved" = "proved"
"Imported theorem" = "imported"
"Finite-domain theorem" = "finite-domain"
"Conditional theorem" = "conditional"
"Open theorem target" = "open"
"Open bridge" = "bridge"
"Empirical evidence" = "evidence"
"Retired claim" = "retired"

[terminology]
risky_phrases = ["obvious isomorphism", "canonical analogy", "essentially the same", "nothing but", "proof by analogy"]
negating_context = ["not ", "no ", "without ", "unless ", "must not", "cannot", "does not", "is not", "never"]

[claims]
paths = ["docs/*.md"]
statement_kinds = ["Theorem", "Proposition", "Lemma", "Corollary", "Conjecture", "Hypothesis", "Open Problem", "Imported Theorem"]
window_lines = 6
file_status_marker = "**Status:**"
file_status_lines = 10

[coverage]
tests = ["kernel/tests/test_*.mojo"]
require_classes = ["finite-domain"]
receipts = "kernel/build/claim-receipts.tsv"

[promotion]
proving_phrases = ["is proved", "are proved", "is now proved", "has been proved", "we prove", "is a theorem", "is established", "completes the proof", "settles"]
negating_context = ["not ", "no ", "remains open", "remain open", "open", "would", "conditional", "without", "if ", "unless", "cannot", "assum", "requir", "needs", "target", "does not", "unproved", "evidence", "only under"]
settled_classes = ["proved", "imported", "finite-domain", "conditional"]
radius = 120

[[numerics.rule]]
name = "no-float-in-kernel"
pattern = '\b(?:Float16|Float32|Float64|BFloat16|FloatLiteral|Float|float)\b|(?<![\w.])(?:\d(?:_?\d)*\.(?:\d(?:_?\d)*)?|\.\d(?:_?\d)*)(?:[eE][+-]?\d(?:_?\d)*)?(?![\w.])|(?<![\w.])\d(?:_?\d)*[eE][+-]?\d(?:_?\d)*(?![\w.])'
paths = ["kernel/sadic/**/*.mojo", "kernel/*.mojo", "kernel/tests/*.mojo"]
message = "floating point in exact kernel scope (methodology rule R2)"

[[numerics.rule]]
name = "no-float-in-oracle"
pattern = '\bfloat\b|\bmath\.(?:sqrt|log|exp|sin|cos|pow)\b|\bnumpy\b'
paths = ["reference/sadic_reference/*.py"]
message = "the Python oracle must stay exact (fractions.Fraction and int only)"

