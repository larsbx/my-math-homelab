[project]
name = "langlands-lab"
version = "0.1.0"
description = "Exact finite-field instrumentation of three Langlands entry points"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["kernel"]

[tool.pytest.ini_options]
pythonpath = ["kernel"]
testpaths = ["tests"]
markers = ["slow: exhaustive checks over larger fields (deselect with -m 'not slow')"]
addopts = "-q"
