name: CI

# One job per authority plane (ESTATE.toml). A plane's job fails, never skips,
# when its toolchain is missing.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy:
    name: policy (estate layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Estate audit (pinned public artifact)
        run: |
          set -eu
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          pin=$(python3 -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          test "$rev" = "0833929ed82d42cf3674a1565681625a9622827b"
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/estate-audit.py "https://raw.githubusercontent.com/larsbx/finite-math-kernels/4485675c1ed5da52beafad98c5118dc0ffc22456/policy/estate-audits/$rev.py"
          printf '%s  %s\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
          python3 /tmp/estate-audit.py --root .

  kernel:
    name: kernel + conformance (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --ignore=tests/test_lean_gate.py

  proof:
    name: proof (Lean gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            proof/langlands/.lake
          key: lean-${{ hashFiles('proof/langlands/lean-toolchain', 'proof/langlands/lake-manifest.json') }}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python -m pytest tests/test_lean_gate.py
