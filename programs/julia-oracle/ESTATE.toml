version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "julia-oracle-lab"
slug = "larsbx/julia-oracle-lab"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "0833929ed82d42cf3674a1565681625a9622827b"
pin = "sha256:7dff31575b2834b937395f3ff6f7ce2e2d1d7927b893cf8229c682ad7f3a99d2"

[[conform]]
id = "finite-math-kernels"
vectors = "bigint-canonical-v1"

[exports]
names = ["JuliaOracleLab", "julia-oracle-registry/v1"]

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# The oracle registry and the schema of its entries are the lab's policy.
[[plane]]
id = "policy"
target = "registry"
authority = "governance"
required = true
current = ["registry", "ESTATE.toml"]

# Julia's package layout fixes the kernel at src/: registry and binding validation only.
[[plane]]
id = "kernel"
target = "src"
authority = "canonical_executable"
required = true
current = ["src"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

# Pkg.test() fixes conformance at test/.
[[plane]]
id = "conformance"
target = "test"
authority = "evidence"
required = true
current = ["test"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ROADMAP.md", "CHANGELOG.md", "ARCHITECTURE.md"]

[[language]]
# Julia is canonical for the lab's own kernel (registry and binding validation)
# only. The lab sits outside every acceptance boundary: docs/AUTHORITY_BOUNDARY.md.
name = "Julia"
authority = "canonical"
roles = ["kernel", "oracle", "experiment"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []
