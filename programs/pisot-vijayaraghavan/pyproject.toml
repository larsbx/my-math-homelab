[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-problem-research"
version = "0.1.0"
description = "Exact research instrumentation for the Pisot-Vijayaraghavan problem"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
