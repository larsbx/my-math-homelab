          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Catch-up reachability (Q1) on the standing corpus, both endpoints (exact)
        working-directory: kernel
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . one_tile_census.mojo 2>&1) || status=$?
          printf '%s\n' "$out"
          (( ${status:-0} == 0 ))  # the output is printed first, so a failed run is diagnosable
          grep -Fx 'One-tile census, specimens: 4554' <<<"$out"
          grep -Fx 'recurrent vertices: 1154040  in CU: 561624  reach CU: 1056816' <<<"$out"
          grep -Fx 'specimens failing Q1: 360  of which no recurrent vertex reaches CU: 210' <<<"$out"
          grep -Fx 'catch-up-free (no proper prefix in M Z^3): 210  of which Q1 fails totally: 210  total failures not catch-up-free: 0' <<<"$out"
          grep -Fx "Proposition P' (level = M-adic valuation to depth 5 ) iff catch-up-free, mismatches: 0" <<<"$out"
          grep -Fx 'Proposition C (unique odd-letter shape) iff catch-up-free, mismatches: 0  one odd letter: 18' <<<"$out"
          grep -Fx 'Q1-failing vertices outside the catch-up-free class: 348  with nonzero forward closure <= 2: 348' <<<"$out"
          grep -Fx 'specimens failing Q1 at both endpoints: 360  of which no recurrent vertex reaches either: 210' <<<"$out"
      - name: Anatomy of the one-tile analysis (exact)
        working-directory: kernel
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . one_tile_anatomy.mojo 2>&1) || status=$?
          printf '%s\n' "$out"
          (( ${status:-0} == 0 ))  # the output is printed first, so a failed run is diagnosable
          grep -Fx 'One-tile anatomy, specimens: 4554' <<<"$out"
          grep -Fx 'class |det M| 1 real : specimens 648  Q1 partial 48  Q1 total 0' <<<"$out"
          grep -Fx 'class |det M| 1 complex : specimens 1980  Q1 partial 54  Q1 total 0' <<<"$out"
          grep -Fx 'class |det M| 2 complex : specimens 1926  Q1 partial 48  Q1 total 210' <<<"$out"
          grep -Fx 'Q1-failing vertices outside the catch-up-free class by nonzero closure size: 1: 276  2: 72  >2: 0' <<<"$out"
          grep -Fx 'not catch-up-free: 4344  with a recurrent one-step catch-up: 4170  recurrent one-step vertices: 29712  without: 174' <<<"$out"
          grep -Fx 'specimens without a recurrent one-step catch-up that fail Q1: 0' <<<"$out"
          grep -Fx 'recurrent vertices: 1154040  reach a diagonal hit: 1080828  reach an off-diagonal hit: 1153308' <<<"$out"
          grep -Fx 'catch-up-free: every recurrent vertex reaches a diagonal hit: 180  not: 30  vertices reaching none: 12276' <<<"$out"
      - name: Occurrence-level all-path decision matches every committed standing failure label
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p build
          if ! pixi run mojo run -I . catch_up_witness_census.mojo standing 0 4554 failures > build/hit-witness-standing.txt 2> build/hit-witness-standing.stderr; then
            cat build/hit-witness-standing.stderr
            exit 1
          fi
          head -5 build/hit-witness-standing.txt
          python ../tools/check_hit_witness_evidence.py --live-output build/hit-witness-standing.txt

