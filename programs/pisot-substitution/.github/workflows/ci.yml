name: PSC research checks

on:
  push:
  pull_request:

jobs:
  policy:
    name: policy (estate layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Estate audit (pinned public artifact)
        run: |
          set -eu
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          pin=$(python3 -c 'import tomllib; print(next(d["pin"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          test "$rev" = "0833929ed82d42cf3674a1565681625a9622827b"
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/estate-audit.py "https://raw.githubusercontent.com/larsbx/finite-math-kernels/4485675c1ed5da52beafad98c5118dc0ffc22456/policy/estate-audits/$rev.py"
          printf '%s  %s\n' "${pin#sha256:}" /tmp/estate-audit.py | sha256sum --check --strict -
          python3 /tmp/estate-audit.py --root .

  source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned PDF parser used by the manuscript-source guard
        run: python -m pip install "pypdf==6.19.0"
      - name: Verify Issue 45 source snapshots and manuscript sources
        run: ./tools/verify_all.sh provenance

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -e .[dev]
      - run: python tools/vendoring/check_vendored_sync.py
      - name: Generated ledger surfaces are current (proof/tla/ledger.json, proof/tla/Ledger.tla, models, index, claims)
        run: python tools/make_ledger.py --check
      - name: Generated mathematical-object catalogue is current
        run: python tools/make_math_catalogue.py --check
      - name: The polyglot envelope is the rendering of its vendored template
        run: python tools/polyglot_envelope/render.py --check
      - name: Claim governance audit (claim_governance.toml)
        run: PYTHONPATH=tools python -m claim_governance.cli --root .
      - name: The oracle corpus matches its declared refinement
        run: python tools/corpus_refinement.py --check
      - run: pytest

  mojo-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.81.0 PIXI_NO_PATH_UPDATE=1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SessionStart provisioning and real bare-Mojo activation regression
        run: |
          python -m pip install pytest
          PSC_SESSION_START_REAL_PIXI="$HOME/.pixi/bin/pixi" python -m pytest tests/test_session_start.py
      - name: Canonical Mojo regression tests
        working-directory: kernel
        run: pixi run test
      - name: Every claim the policy requires guarded has a passing test (run receipts)
        run: PYTHONPATH=tools python3 -m claim_governance.cli --root . --check coverage
      - name: Certificate checks
        working-directory: kernel
        run: pixi run verify
      - name: Alphabet-3 census regression
        working-directory: kernel
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . census.mojo 2>&1) || status=$?
          printf '%s\n' "$out"
          (( ${status:-0} == 0 ))  # the output is printed first, so a failed run is diagnosable
          grep -Eq '^PIP specimens \(images of length <= 3\):[[:space:]]+4554$' <<<"$out"
          grep -Eq '^[[:space:]]*B_sigma construction terminated:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Eq '^[[:space:]]*productive:[[:space:]]+4554[[:space:]]+non-productive:[[:space:]]+0$' <<<"$out"

