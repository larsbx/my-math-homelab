name: Target-aware BPA diagnostic

on:
  push:
    paths:
      - 'kernel/psc/target_packet*.mojo'
      - 'kernel/target_aware_bpa.mojo'
      - 'kernel/check_target_packets.sh'
      - 'kernel/psc/packet_hub_analysis.mojo'
      - 'kernel/ordered_hub_packets.mojo'
      - 'kernel/check_ordered_hub.sh'
      - 'kernel/tests/test_packet_hub_analysis.mojo'
      - 'kernel/tests/test_target_packets.mojo'
      - 'kernel/pixi.*'
      - 'docs/target-aware-bpa*.md'
      - 'evidence/target-aware-bpa-2026-10-02/**'
      - 'evidence/ordered-hub-packets-2026-10-06/**'
      - 'docs/c4-ordered-hub*.md'
      - 'tests/test_target_packet_evidence.py'
      - 'tests/test_ordered_hub_evidence.py'
      - '.github/workflows/target-aware-bpa.yml'
  pull_request:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: kernel/pixi.toml
      - name: Canonical Mojo regressions and receipts
        working-directory: kernel
        run: pixi run test
      - name: Canonical exact certificates
        working-directory: kernel
        run: pixi run verify
      - name: Deterministic diagnostic replay and CLI boundaries
        working-directory: kernel
        run: pixi run bash check_target_packets.sh
      - name: Independent literal-word oracle
        run: python -m pytest tests/test_target_packet_evidence.py tests/test_ordered_hub_evidence.py tests/test_synthetic_degree2.py
      - name: Ordered-hub and hierarchy-offset golden replay
        working-directory: kernel
        run: pixi run bash check_ordered_hub.sh
      - name: Vendoring, generated surfaces, and claim governance
        run: |
          python tools/vendoring/check_vendored_sync.py
          python tools/make_ledger.py --check
          python tools/make_math_catalogue.py --check
          PYTHONPATH=tools python -m claim_governance.cli --root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-aware-bpa-receipts
          path: |
            kernel/build/target-*.jsonl
            kernel/build/target-*.log
            kernel/build/ordered-hub-*.jsonl
            kernel/build/ordered-hub-*.log
            kernel/build/claim-receipts.tsv
