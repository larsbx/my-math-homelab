version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "pisot-substitution-conjecture-research"
slug = "larsbx/pisot-substitution-conjecture-research"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "0833929ed82d42cf3674a1565681625a9622827b"
pin = "sha256:7dff31575b2834b937395f3ff6f7ce2e2d1d7927b893cf8229c682ad7f3a99d2"

# vendored.toml: metadata and file contents of every package vendored from
# larsbx/finite-math-kernels, hashed together; re-pin whenever a package is re-vendored.
[[dep]]
id = "finite-math-kernels"
pin = "sha256:2422e71f0f499c49e59167fc85bc4f42ab3f6bccf42ff06594df22064bf0054a"

[exports]
names = []

# Canonical: every plane maps exactly its target (root-level files aside) and
# every top-level directory is some plane's target.
[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "ESTATE.toml"
authority = "governance"
required = true
current = ["ESTATE.toml", "claim_governance.toml", "vendored.toml", "polyglot.manifest.toml"]

# Mojo include root (-I .) and pixi workspace. Vendored packages sit beside psc/ (vendored.toml root = "kernel").
[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

# Lean (proof/PscVerif) is the deductive finite-algebra layer; TLA+ the proof-dependency model.
# proof/tla/ledger.json, proof/tla/Ledger.tla and proof/tla/MCLedger* are generated by tools/make_ledger.py.
[[plane]]
id = "proof"
target = "proof"
authority = "claim_state"
required = true
current = ["proof"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

# Independent Python census oracles.
[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "experiments"
target = "experiments"
authority = "non_authoritative_experiment"
required = true
current = ["experiments"]

[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

# Recorded run outputs, verbatim; each packet pins its files in SHA256SUMS (tests/test_recorded_data_integrity.py).
[[plane]]
id = "evidence"
target = "evidence"
authority = "evidence"
required = true
current = ["evidence"]

# Imported external sources and their provenance, verbatim; SHA256SUMS where bytes are imported.
[[plane]]
id = "sources"
target = "sources"
authority = "pinned_external"
required = true
current = ["sources"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

# claim_governance, proof_records, oracle_refinement and vendoring (the checker of
# vendored.toml itself) under tools/ are vendored (vendored.toml);
# the repository tooling sits beside them at the tools/ root.
[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

# docs/catalogues/mathematical_objects.toml is the single source of docs/mathematical-object-catalogue.md.
[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md", "AGENTS.md", "CONTRIBUTING.md"]

[[plane]]
id = "publication"
target = "manuscripts"
authority = "publication"
required = true
current = ["manuscripts"]

# Superseded records, kept verbatim; excluded from the claim-governance scan.
[[plane]]
id = "archive"
target = "archive"
authority = "exposition"
required = true
current = ["archive"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["reference", "oracle", "audit", "proof_records", "generation"]
acceptance_authority = false

[[language]]
name = "Lean"
authority = "supporting"
roles = ["formal_proof_target"]
acceptance_authority = false

[[language]]
name = "TLA+"
authority = "supporting"
roles = ["formal_model"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []
