status = "proved"
statement = "For essential realizations of a torsion-free representable arithmetic matroid with m(E)=1 in declared free ambient lattices, every prescribed arithmetic label isomorphism admits an integral unimodular row change and signed column equivalence. One witness induces isomorphisms of the entire modular bicycle tower and Gram cokernels, with Bic_n(A) isomorphic to coker(AA^T)[n] for every n >= 2, compatible with reduction and inflation. The tower isomorphism class is independent of realization; comparison maps need not be unique."
authority = "repository_integral_proof_record"
proof_record = "proof/surjective-realization-invariance.md"
audit_record = "docs/audits/surjective-realization-invariance-2026-10-15.md"
