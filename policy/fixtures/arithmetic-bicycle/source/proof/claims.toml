[[claim]]
id = "ABC-ARITHMETIC-REALIZATION-COUNTEREXAMPLE"
title = "Rank-two arithmetic bicycle realization counterexample"
status = "proved"
statement = "The essential integer realizations A=((1,1),(0,5)) and A'=((1,2),(0,5)) in Z^2 have common labeled subset ranks (0,1,1,2) and multiplicities (1,1,1,5), but Bic_5 and Bic_10 have orders one for A and five for A'. Thus the compatible modular bicycle tower is not an invariant of the torsion-free arithmetic matroid."
authority = "repository_counterexample_proof_record"
proof_record = "proof/arithmetic-realization-counterexample.md"
audit_record = "docs/audits/arithmetic-matroid-2026-10-14.md"
