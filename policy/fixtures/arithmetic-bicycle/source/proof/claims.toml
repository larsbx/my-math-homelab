[[claim]]
id = "ABC-MAIN"
title = "Arithmetic Bicycle Conjecture"
status = "retracted"
statement = "For a torsion-free representable arithmetic matroid, the compatible modular bicycle tower is independent of the chosen integral realization."
authority = "repository_counterexample_proof_record"
counterexample_record = "proof/arithmetic-realization-counterexample.md"
audit_record = "docs/audits/arithmetic-matroid-2026-10-14.md"
evidence = ["oracles/arithmetic_matroid.py", "conformance/fixtures/arithmetic-matroid-v1.json", "conformance/test_arithmetic_matroid.py", "conformance/replay_arithmetic_matroid.py", "conformance/receipts/arithmetic-matroid-v1.json"]
notes = "Refuted on 2026-10-14: A=((1,1),(0,5)) and A'=((1,2),(0,5)) have identical complete arithmetic data but bicycle orders one and five at moduli 5 and 10. Both are essential and torsion-free, with m(E)=5. The earlier universal torsion-model withdrawal is a separate negative result."

