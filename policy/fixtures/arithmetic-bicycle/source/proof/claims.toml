notes = "Direct cut/cycle congruences give the elementary proof, including mixed-composite modulus 10. Complete arithmetic data and modular lattice membership are independently checked. Graph and TU results remain valid; nonsurjective arithmetic realizations are inside the original conjecture's domain."

