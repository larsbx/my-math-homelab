[[claim]]
id = "ABC-CODE-HULL-TOWER"
title = "Euclidean code-hull quotient and modular tower interface"
status = "proved"
statement = "For every rectangular integer matrix A and every n >= 2, Hull(im A^T) = im A^T intersect ker A is naturally isomorphic to ker(AA^T)/ker(A^T) over Z/n. Reduction and scaled inflation descend to the quotient, commute with this isomorphism, compose across dividing moduli, and have both round trips equal to multiplication by the modulus ratio. Standard-pairing isometries are exactly S^T S=I at each modulus; coherent orthogonal edge and invertible row witnesses transport the tower, and a fixed integral edge isometry at every modulus is exactly a signed permutation."
authority = "repository_ring_proof_record"
proof_record = "proof/code-hull-tower.md"
audit_record = "docs/audits/code-hull-tower-2026-10-16.md"
evidence = ["kernel/code_hull.py", "conformance/fixtures/code-hull-tower-v1.json", "conformance/test_code_hull.py", "conformance/replay_code_hull.py", "conformance/receipts/code-hull-tower-v1.json", "experiments/realization_dependence.py", "oracles/arithmetic_matroid.py"]
notes = "Elementary ring proof without essentiality, surjectivity, or field-rank assumptions. Quotient inflation is injective; reduction need not be onto. Proof record supplies authority; finite receipts and Python do not. No machine-checked formalization, novelty, or nonsurjective classification is claimed. ABC-MAIN, ABC-REALIZATION-INVARIANCE, and ABC-UNIVERSAL-TORSION-MODEL remain retracted."
