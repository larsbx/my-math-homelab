# Registry for ALL active sources in policy/source-locks.toml.
# Each track has a weekly research/evidence cycle. Only explicitly specialized
# tracks execute a mathematical experiment; other tracks MUST report their
# independent reproduction adapter as pending, never pretend a proof ran.
version = 1
contract = "math-estate-research-v1"
authority = "source_retained"
daily_cron_utc = "43 4 * * *"
weekly_cron_utc = "47 5 * * 2"
automatic_claim_promotion = false
automatic_merge = false

[[track]]
id = "arithmetic-bicycle"
claim_namespace = "AB"
kind = "program"
source_repository = "larsbx/arithmetic-bicycle-conjecture-research"
objective = "Exact arithmetic matroids and realization invariance after the rank-two refutation"
next_research_obligation = "Recheck the rank-two counterexample and identify corrected invariant statements"
research_evidence_path = "proof/arithmetic-realization-counterexample.md"
mode = "exact_fixture_adapter"
independent_experiment = "homelab_arithmetic_matroid_v1"
claim_authority = "source_retained"
automatic_claim_promotion = false
automatic_merge = false

