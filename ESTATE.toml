version = 2
template = "estate-repository-v2"

# SPEC_estate v0.1 §3 fields, then this template's layout sections.

[repo]
id = "finite-julia-set-research"
slug = "larsbx/finite-julia-set-research"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"           # written by estate CI only (no estate CI ledger exists yet)
inv = []                      # INV families: registration pending
default_branch = "main"

[origin]
decided_by = "proposed"       # agent-authored; the owner adopts it by decision record
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "2852e5f3e9ae84bdb9e36b026e606977758b3df8"
pin = "sha256:2147d7e1c97a235c4da15284fb64638b0b657f4432afd66a9b57f7e824293a08"

[[dep]]                       # vendored packages, pinned by digest in vendored.toml
id = "finite-math-kernels"
pin = "sha256:12280d00a85845824e13a347ed0a42da633b88ac0516a72d5301da468b0351a9"

[exports]
names = []

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# Policy is four root manifests; no policy/ silo is created for them.
[[plane]]
id = "policy"
target = "ESTATE.toml"
authority = "governance"
required = true
current = ["ESTATE.toml", "backend.toml", "polyglot.manifest.toml", "vendored.toml"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

# The polyglot boundary envelope and its conformance vectors.
[[plane]]
id = "schemas"
target = ".polyglot"
authority = "contract"
required = true
current = [".polyglot"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests", "corpus.json"]

# vendor/mojo and vendor/python are the include roots named in vendored.toml.
[[plane]]
id = "vendor"
target = "vendor"
authority = "pinned_external"
required = true
current = ["vendor"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ROADMAP.md", "ARCHITECTURE.md"]

[[language]]
name = "Mojo"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[[language]]
name = "Python"
authority = "supporting"
roles = ["reference", "audit", "generation"]
acceptance_authority = false

[[language]]
name = "Lean"
authority = "supporting"
roles = ["formal_proof_target"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []
