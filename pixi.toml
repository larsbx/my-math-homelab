[workspace]
authors = ["larsbx"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "finite-julia-set-research"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest tests/"
mojo-smoke = "mojo src/smoke_tests.mojo"
mojo-build = "mojo build src/smoke_tests.mojo -o .pixi/finite-julia-smoke"
transcript = "mojo src/corpus_transcript.mojo"
vendored = "python tools/vendoring/check_vendored_sync.py"
ledgers = "python tools/make_regime_ledger.py"
ledgers-check = "python tools/make_regime_ledger.py --check"

[dependencies]
mojo = "==1.0.0"

[pypi-dependencies]
pytest = "==8.3.5"
